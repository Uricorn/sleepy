<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        var l = localStorage.getItem("sleepy-lang") || (navigator.language || "en").slice(0, 2).toLowerCase();
        document.documentElement.lang = l;
        if (["ar", "he", "fa", "ur"].indexOf(l) > -1) document.documentElement.dir = "rtl";
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0C1017" />
    <meta name="description" content="A private, offline sleep diary stored only on your device." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>Sleepy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
