Builds:
  - versionName: 1.2.3
    versionCode: 6
    commit: 6e004a503e5f4715cb31ad10f757873d2ec25ecc
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
      - apt-get install -y curl xz-utils
      - curl -fsSLo /tmp/node.tar.xz https://nodejs.org/dist/v22.12.0/node-v22.12.0-linux-x64.tar.xz
      - echo "22982235e1b71fa8850f82edd09cdae7e3f32df1764a9ec298c72d25ef2c164f  /tmp/node.tar.xz"
        | sha256sum -c -
      - tar -xJf /tmp/node.tar.xz -C /opt
      - ln -sf /opt/node-v22.12.0-linux-x64/bin/node /usr/local/bin/node
      - ln -sf /opt/node-v22.12.0-linux-x64/bin/npm /usr/local/bin/npm
      - ln -sf /opt/node-v22.12.0-linux-x64/bin/npx /usr/local/bin/npx
    init:
      - cd ../..
      - npm ci --ignore-scripts --no-audit --no-fund
      - npm run build
    gradle:
      - yes

AllowedAPKSigningKeys: 4b4b4e81c91851cc33eb7b0276b955ed0947c756901d39218391db0ce6b0d22b

