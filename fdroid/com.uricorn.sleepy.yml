# DRAFT F-Droid build recipe. Copy to metadata/com.uricorn.sleepy.yml in a fork of
# https://gitlab.com/fdroid/fdroiddata and open a merge request. See docs/FDROID.md.
# Validate locally first:  fdroid readmeta && fdroid lint com.uricorn.sleepy &&
#                          fdroid build -v -l com.uricorn.sleepy
Categories:
  - Sports & Health
License: AGPL-3.0-only
AuthorName: Uricorn
WebSite: https://github.com/Uricorn/sleepy
SourceCode: https://github.com/Uricorn/sleepy
IssueTracker: https://github.com/Uricorn/sleepy/issues
Changelog: https://github.com/Uricorn/sleepy/blob/HEAD/CHANGELOG.md

AutoName: Sleepy

RepoType: git
Repo: https://github.com/Uricorn/sleepy.git

Builds:
  - versionName: 1.2.2
    versionCode: 5
    commit: v1.2.2
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils
      - curl -fsSLo /tmp/node.tar.xz https://nodejs.org/dist/v22.12.0/node-v22.12.0-linux-x64.tar.xz
      - echo "22982235e1b71fa8850f82edd09cdae7e3f32df1764a9ec298c72d25ef2c164f  /tmp/node.tar.xz" | sha256sum -c -
      - tar -xJf /tmp/node.tar.xz -C /opt
      - ln -sf /opt/node-v22.12.0-linux-x64/bin/node /usr/local/bin/node
      - ln -sf /opt/node-v22.12.0-linux-x64/bin/npm /usr/local/bin/npm
      - ln -sf /opt/node-v22.12.0-linux-x64/bin/npx /usr/local/bin/npx
    init:
      - cd ../..
      - npm ci --ignore-scripts --no-audit --no-fund
      # F-Droid variant: no build-time download, no bundled speech model (mic button hidden).
      # dist/ is built here and bundled by Gradle; do not add an rm: for it.
      - SLEEPY_SKIP_VOICE=1 npm run build
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: android/app/build.gradle|versionCode\s+(\d+)|android/app/build.gradle|versionName\s+'([\d.]+)'
CurrentVersion: 1.2.2
CurrentVersionCode: 5
