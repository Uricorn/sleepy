# DRAFT F-Droid build recipe. Copy to metadata/com.uricorn.sleepy.yml in a fork of
# https://gitlab.com/fdroid/fdroiddata and open a merge request. See docs/FDROID.md.
# Validate locally first:  fdroid readmeta && fdroid lint com.uricorn.sleepy &&
#                          fdroid build -v -l com.uricorn.sleepy
Categories:
  - Sports & Health
License: MIT
AuthorName: Uricorn
WebSite: https://github.com/Uricorn/sleepy
SourceCode: https://github.com/Uricorn/sleepy
IssueTracker: https://github.com/Uricorn/sleepy/issues
Changelog: https://github.com/Uricorn/sleepy/blob/HEAD/CHANGELOG.md

AutoName: Sleepy

RepoType: git
Repo: https://github.com/Uricorn/sleepy.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
      - npm install -g n
      - n 22.12.0
    init:
      - cd ../..
      - npm ci --ignore-scripts --no-audit --no-fund
      - npm run build
    rm:
      - dist
    gradle:
      - yes
    # The web assets are produced by npm; the committed gradle wrapper jar is verified by F-Droid.
    scanignore: []

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: android/app/build.gradle|versionCode\s+(\d+)|android/app/build.gradle|versionName\s+'([\d.]+)'
CurrentVersion: 1.0.0
CurrentVersionCode: 1
