name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, test, build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 3

  android:
    name: Android debug build + lint
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Assemble debug APK and run Android lint
        working-directory: android
        run: ./gradlew assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sleepy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Verify no INTERNET permission in the built APK
        run: |
          set -eu
          aapt="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          perms="$("$aapt" dump permissions android/app/build/outputs/apk/debug/app-debug.apk)"
          echo "$perms"
          if echo "$perms" | grep -q 'android.permission.INTERNET'; then
            echo "INTERNET permission found in APK" >&2; exit 1
          fi
