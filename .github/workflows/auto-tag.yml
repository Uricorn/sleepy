name: Auto tag

# When package.json's version on main has no matching vX.Y.Z tag yet, create it and start the
# Release workflow. Bump versions as described in docs/RELEASING.md; merging that to main is the release.
on:
  push:
    branches: [main]

concurrency:
  group: auto-tag
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Tag new version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Create tag and dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do."; exit 0
          fi
          code="$(grep -oE "versionCode +[0-9]+" android/app/build.gradle | grep -oE "[0-9]+")"
          [ -f "fastlane/metadata/android/en-US/changelogs/$code.txt" ] || { echo "Missing changelog for versionCode $code" >&2; exit 1; }
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          gh workflow run release.yml --ref "$tag"
