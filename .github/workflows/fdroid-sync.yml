name: Sync F-Droid recipe

# Pushes fdroid/com.uricorn.sleepy.yml to a branch of your fdroiddata fork on GitLab, so the open
# merge request updates itself. Setup (once):
#   Secret FDROID_GITLAB_TOKEN  GitLab access token with write_repository on the fork
# Fork and branch are hard-coded below. Skips silently until the secret is set.
on:
  push:
    branches: [main]
    paths: [fdroid/com.uricorn.sleepy.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Push recipe to fdroiddata fork
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
      FORK: uricorn/fdroiddata
      BRANCH: com.uricorn.sleepy
    steps:
      - uses: actions/checkout@v7
      - name: Sync
        run: |
          if [ -z "$TOKEN" ]; then
            echo "FDROID_GITLAB_TOKEN not set; skipping."
            exit 0
          fi
          git clone --depth 1 "https://oauth2:${TOKEN}@gitlab.com/${FORK}.git" /tmp/fdroiddata
          cd /tmp/fdroiddata
          git checkout -B "$BRANCH"
          cp "$GITHUB_WORKSPACE/fdroid/com.uricorn.sleepy.yml" metadata/com.uricorn.sleepy.yml
          if git diff --quiet HEAD -- metadata/com.uricorn.sleepy.yml && git ls-files --error-unmatch metadata/com.uricorn.sleepy.yml >/dev/null 2>&1; then
            echo "Recipe unchanged."
            exit 0
          fi
          git add metadata/com.uricorn.sleepy.yml
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" \
            commit -m "New app: com.uricorn.sleepy"
          git push --force origin "$BRANCH"
