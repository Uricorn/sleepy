name: Latest debug build

# Publishes the debug APK from every push to main as a rolling "latest" pre-release.
on:
  push:
    branches: [main]

concurrency:
  group: latest-debug
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  latest:
    name: Build and publish latest debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
      - run: npm ci
      - run: npm run build
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cp android/app/build/outputs/apk/debug/app-debug.apk sleepy-debug.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest sleepy-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --notes "Debug-signed test APK built from commit $GITHUB_SHA. Not for production; it is replaced on every push to main."
